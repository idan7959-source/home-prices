# Every morning: download the chains' price files and publish data/prices.json on GitHub Pages.
name: daily-prices

on:
  schedule:
    - cron: '30 3 * * *' # 03:30 UTC = 05:30 Israel (winter) / 06:30 (summer)
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/fetch-prices.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: data
      # Since Nov 2026 the uploaded artifact sometimes isn't listed yet when deploy-pages looks for it
      # ("No artifacts named github-pages"). A short pause lets GitHub register it first.
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
